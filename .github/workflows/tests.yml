# The first CI this repo has had.
#
# ⚠ WHY IT MATTERS HERE SPECIFICALLY: the engine has run its suite on every
# push since 2026-08-17, and this tree — 682 tests and a lint — has only ever
# been checked on a developer's laptop. Two changes shipped today whose test
# runs nobody but the author ever saw, and one of them was a file the tooling
# silently failed to write. A green terminal is not a green build.
#
# ⚠ AND WHAT IT STILL DOES NOT CHECK. Nine assertions in this suite read the
# ENGINE repository directly — the generation vocabulary, the reason codes, the
# preflight sections — because the failure they catch is DRIFT BETWEEN TWO
# REPOS, which neither one can see alone. Without the engine checked out beside
# this tree they SKIP, printing "SKIPPED cross-repo check (…)" per contract. The
# `contracts` job below runs them for real, and only runs when a token that can
# read the engine repo exists. Until that secret is set, this build is honest
# about being partial rather than quietly smaller than it looks.
name: tests

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # ⚠ 11, NOT 9. The lockfile says `lockfileVersion: 9.0` and that is
          # not the pnpm version — pnpm 10 and 11 both write it. This repo's
          # pnpm-workspace.yaml carries SETTINGS (`allowBuilds`,
          # `verifyDepsBeforeRun`) and declares no packages, which pnpm 10+
          # supports and pnpm 9 rejects outright with "packages field missing
          # or empty". The second CI run died on exactly that, at install.
          version: 11

      - uses: actions/setup-node@v4
        with:
          # ⚠ NOT 22. tests/harness/register.mjs uses `module.registerHooks`,
          # which does not exist before 22.15 — pinning "22" would fail on the
          # loader with an error that looks nothing like the cause.
          node-version: "24"
          # ⚠ NO `cache: pnpm`. It shells out to `pnpm store path`, which fails
          # here with "packages field missing or empty": this repo has a
          # pnpm-workspace.yaml that carries SETTINGS and declares no packages,
          # so pnpm treats the root as a workspace with nothing in it. Caching
          # is worth ~20s and not worth editing that file for. Found by the
          # first run of this workflow, which is what it is for.
      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/out

      # Read from the run that already happened, rather than running the suite
      # twice to count something it already printed.
      - name: Say which cross-repo contracts this run did NOT verify
        if: always()
        run: |
          n=$(grep -c "SKIPPED cross-repo check" /tmp/out || true)
          echo "Cross-repo contracts skipped in this job: ${n:-0}" >> "$GITHUB_STEP_SUMMARY"
          grep "SKIPPED cross-repo check" /tmp/out >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "They run for real in the 'contracts' job, which needs the ATELIER_ENGINE_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: pnpm lint

  # Whether the token exists at all. `secrets` is not readable from a job-level
  # `if`, so it is read in a step and passed on as an output — the standard
  # shape, written down because it looks like indirection for its own sake.
  can-reach-engine:
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.probe.outputs.yes }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.ATELIER_ENGINE_TOKEN }}
        run: echo "yes=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  contracts:
    needs: can-reach-engine
    if: needs.can-reach-engine.outputs.yes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: atelier-professional

      # The suite looks for the engine as a sibling; ATELIER_ENGINE_TREE makes
      # that explicit instead of depending on the checkout layout.
      - uses: actions/checkout@v4
        with:
          repository: kiviik/atelier-engine
          token: ${{ secrets.ATELIER_ENGINE_TOKEN }}
          path: atelier-engine

      - uses: pnpm/action-setup@v4
        with:
          version: 11        # same reason as the web job

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # no pnpm cache, same reason as the web job

      - run: pnpm install --frozen-lockfile
        working-directory: atelier-professional

      - name: Tests, with the cross-repo contracts actually running
        working-directory: atelier-professional
        env:
          ATELIER_ENGINE_TREE: ${{ github.workspace }}/atelier-engine
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/out
          # ⚠ The point of this job. If a contract skipped here, the engine
          # checkout did not land where the tests look, and a green run would
          # mean less than it says.
          if grep -q "SKIPPED cross-repo check" /tmp/out; then
            echo "::error::the engine tree was not readable — cross-repo contracts did not run"
            exit 1
          fi

allowBuilds:
  # esbuild's install script only picks the platform binary that its own
  # optionalDependencies already provide; transform works without it (checked).
  esbuild: false
  # ⚠ Was the literal string "set this to true or false" — a placeholder that
  # is not a boolean, so pnpm treated the package as undecided. Locally that is
  # invisible (the answer already sits in the store); in CI, `pnpm install`
  # exits 1 with ERR_PNPM_IGNORED_BUILDS. Found by the first CI this repo has
  # had, on its third run.
  #
  # false, for esbuild's reason one line up: unrs-resolver is a napi package
  # whose platform binary arrives through its own optionalDependencies, and the
  # build script is not what produces it. `pnpm lint` runs in the same CI job,
  # so this claim is checked on every push rather than asserted here.
  unrs-resolver: false
verifyDepsBeforeRun: false
